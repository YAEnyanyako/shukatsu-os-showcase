<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Shukatsu OS — Evidence before action</title><desc id="desc">Conceptual project illustration: source notifications flow through evidence verification into next actions. All samples are fictional.</desc>
  <rect width="1280" height="440" rx="24" fill="#193c38"/>
  <circle cx="1120" cy="35" r="240" fill="none" stroke="#35544a"/><circle cx="1120" cy="35" r="190" fill="none" stroke="#35544a"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="65" y="65" font-size="13" letter-spacing="4" fill="#cadcab">SHUKATSU OS / WORKFLOW LAB</text>
  <text x="62" y="150" font-size="51" font-weight="600" letter-spacing="-1.5" fill="#f4f8e9">Evidence before action.</text>
  <text x="65" y="191" font-size="18" fill="#b9cfc0">A clear path from scattered notifications to the next right step.</text>
  <g transform="translate(65 240)"><rect width="330" height="121" rx="13" fill="#f1f5e7"/><text x="22" y="31" font-size="10" letter-spacing="2" fill="#648052">01 / ORGANIZE</text><text x="22" y="63" font-size="21" fill="#274b3c">Company context</text><text x="22" y="93" font-size="13" fill="#69765f">Connect messages across sources.</text></g>
  <path d="M410 301h22m-6-6 6 6-6 6" fill="none" stroke="#b8cf9b" stroke-width="2"/>
  <g transform="translate(451 240)"><rect width="330" height="121" rx="13" fill="#dcebb5"/><text x="22" y="31" font-size="10" letter-spacing="2" fill="#648052">02 / VERIFY</text><text x="22" y="63" font-size="21" fill="#274b3c">Traceable evidence</text><text x="22" y="93" font-size="13" fill="#69765f">Keep dates and uncertainty distinct.</text></g>
  <path d="M796 301h22m-6-6 6 6-6 6" fill="none" stroke="#b8cf9b" stroke-width="2"/>
  <g transform="translate(837 240)"><rect width="378" height="121" rx="13" fill="#f1f5e7"/><text x="22" y="31" font-size="10" letter-spacing="2" fill="#648052">03 / FOLLOW THROUGH</text><text x="22" y="63" font-size="21" fill="#274b3c">Reviewable next actions</text><text x="22" y="93" font-size="13" fill="#69765f">Update state without duplicate work.</text></g>
  <text x="65" y="408" font-size="11" letter-spacing="1" fill="#b1c8b8">INTERACTIVE PUBLIC DEMO · FICTIONAL DATA · NO LIVE CONNECTIONS</text></g>
</svg>
